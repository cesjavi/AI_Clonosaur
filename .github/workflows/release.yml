name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri v2's runtime deps on Linux. whisper-rs also needs a C/C++
      # toolchain (cmake, clang/libclang for bindgen) to build whisper.cpp
      # from source — only needed here for Ubuntu; the macOS and Windows
      # GitHub-hosted runner images already ship cmake and clang/LLVM.
      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            cmake \
            clang \
            libclang-dev

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required repo secrets (Settings → Secrets and variables →
          # Actions), generated locally with `npx tauri signer generate`.
          # Without these, tauri-action still builds the installers but
          # skips producing signed updater artifacts, so existing installs
          # won't see the new version as an available update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Clonosaur ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version."
          # Draft so a broken/accidental tag push never surfaces a public
          # release without a human confirming it first — publish manually
          # from the GitHub Releases page once the build looks right.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
