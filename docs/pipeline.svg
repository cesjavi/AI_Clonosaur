<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="380" fill="#f8fafc"/>

  <text x="40" y="34" font-size="19" font-weight="700" fill="#0f172a">How your data becomes a clone</text>
  <text x="40" y="54" font-size="12.5" fill="#64748b">Everything below runs against the local SQLite database — no external API calls happen anywhere in this diagram.</text>

  <!-- Column 1: Import -->
  <rect x="40" y="80" width="190" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="52" y="98" font-size="8.5" font-weight="700" letter-spacing="0.5" fill="#047857">IMPORT SCREEN</text>
  <text x="52" y="120" font-size="12.5" font-weight="700" fill="#0f172a">Message sources</text>
  <text x="52" y="138" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#475569">WhatsApp · Gmail · X</text>
  <text x="52" y="150" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#475569">Discord · Reddit · generic</text>

  <rect x="40" y="200" width="190" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="52" y="218" font-size="8.5" font-weight="700" letter-spacing="0.5" fill="#047857">INTERVIEW SCREEN</text>
  <text x="52" y="240" font-size="12.5" font-weight="700" fill="#0f172a">Guided interview</text>
  <text x="52" y="258" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#475569">identity · mental style</text>
  <text x="52" y="270" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#475569">relationships · clone control</text>

  <!-- Arrows col1 -> col2 -->
  <line x1="230" y1="115" x2="292" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="234" y="107" font-size="8.5" fill="#475569">normalize, dedupe</text>
  <line x1="230" y1="245" x2="292" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="234" y="263" font-size="8.5" fill="#475569">persist per answer</text>

  <!-- Column 2: core DB -->
  <rect x="300" y="80" width="190" height="210" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="312" y="98" font-size="8.5" font-weight="700" letter-spacing="0.5" fill="#047857">CORE</text>
  <text x="312" y="122" font-size="13.5" font-weight="700" fill="#0f172a">Local SQLite</text>
  <text x="312" y="150" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#475569">messages · people</text>
  <text x="312" y="164" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#475569">conversations</text>
  <text x="312" y="178" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#475569">profile_traits</text>
  <text x="312" y="192" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#475569">memories</text>
  <text x="312" y="270" font-size="9" fill="#047857" font-style="italic">clonosaur.db</text>

  <!-- Arrows col2 -> col3 -->
  <line x1="490" y1="115" x2="552" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="494" y="107" font-size="8.5" fill="#475569">generate vectors</text>
  <line x1="490" y1="245" x2="552" y2="245" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="494" y="263" font-size="8.5" fill="#475569">gather + cite evidence</text>

  <!-- Column 3: understand -->
  <rect x="560" y="80" width="210" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="572" y="98" font-size="8.5" font-weight="700" letter-spacing="0.5" fill="#047857">MEMORY SCREEN</text>
  <text x="572" y="120" font-size="12.5" font-weight="700" fill="#0f172a">Embeddings + search</text>
  <text x="572" y="138" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#475569">cosine similarity</text>
  <text x="572" y="150" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#475569">"this is me" feedback</text>

  <rect x="560" y="200" width="210" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="572" y="218" font-size="8.5" font-weight="700" letter-spacing="0.5" fill="#047857">PROFILE SCREEN</text>
  <text x="572" y="240" font-size="12.5" font-weight="700" fill="#0f172a">Personality generators</text>
  <text x="572" y="258" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#475569">values · decisions</text>
  <text x="572" y="270" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#475569">tone · contradictions</text>

  <!-- Column 4: use it (drawn before the col3 -> col4 captions so text never sits under a box) -->
  <rect x="880" y="80" width="160" height="90" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="892" y="98" font-size="8.5" font-weight="700" letter-spacing="0.5" fill="#92400e">CHAT SCREEN</text>
  <text x="892" y="120" font-size="12.5" font-weight="700" fill="#0f172a">Chat</text>
  <text x="892" y="138" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#475569">simple · RAG</text>
  <text x="892" y="150" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#475569">hybrid — cites sources</text>

  <rect x="880" y="200" width="160" height="90" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="892" y="218" font-size="8.5" font-weight="700" letter-spacing="0.5" fill="#92400e">COPILOT SCREEN</text>
  <text x="892" y="240" font-size="12.5" font-weight="700" fill="#0f172a">Copilot</text>
  <text x="892" y="258" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#475569">drafts only,</text>
  <text x="892" y="270" font-size="9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#475569">never auto-sent</text>

  <!-- Arrows col3 -> col4, amber gate captions -->
  <line x1="770" y1="115" x2="872" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="780" y="107" font-size="8.5" fill="#92400e" font-weight="600">sensitivity filter</text>
  <line x1="770" y1="245" x2="872" y2="245" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="780" y="263" font-size="8.5" fill="#92400e" font-weight="600">excludes flagged contacts</text>

  <text x="40" y="326" font-size="11.5" fill="#64748b">Settings (Ollama / Lemonade URL, models, theme) configures every box above. Metrics reads all of it in real time without changing anything.</text>
  <text x="40" y="348" font-size="11.5" fill="#64748b">Chat's hybrid mode is the one path that leaves this machine — see "How Clonosaur talks to language models" below for that flow.</text>
</svg>
